# Frozen training overlay for ObjectPropertyRegressionTask v12e — paper-faithful priority GLS.
# Usage: python main.py fit --config combined.yaml --config kmax_masking.yaml --config kmax_frozen_property_regression_v12e_gls.yaml
#
# v12e deltas from v12d_splitopt:
#   - Loss aggregation: per-param product-form GLS partitioned by physics priority.
#       L = (∏ L_priority)^{1/3} · (∏ L_bulk)^{1/7}
#       Priority (3): inv_pt, energy_track, energy (neutral)
#       Bulk     (7): d0, z0, phi0, eta, neutral_deta, neutral_dphi, gate_ce
#     Priority/bulk gradient ratio locked at (7/3)·L_b/L_p ≈ 2.33× throughout training (no tuning knobs).
#     Mathematically opposite to Kendall, which downweights "hard" tasks. GLS upweights tasks closer to
#     convergence via 1/L factor, while group sizes encode physics priority.
#   - Kendall log_vars removed (use_per_param_kendall: false). With no learnable per-param weights,
#     no AdamW split is needed → optimizer_group_overrides removed → revert to single-optimizer Lion.
#   - gradient_clip_val: 1.0 (matches v12c/v11b/v8d historical convention; Trainer handles clip
#     since manual optimization is no longer used).
#   See plan: /home/syw24/.claude/plans/rippling-bouncing-walrus.md.
#   See memory: v12d_5k_step_findings.md (Kendall vs physics-priority misalignment that motivated v12e).

name: CLD_kmax_frozen_property_regression_v12e_gls

data:
  batch_size: 10
  num_train: 800000
model:
  freeze_except: [flow_property_regression]
  pretrained_ckpt_path: /share/gpu1/syw24/hepattn/logs/CLD_5_256_10MeV_charged_kmax_20260319-T072454/ckpts/epoch=000-val_loss=15.44639.ckpt

  lrs_config:
    initial: 1e-5
    max: 5e-5
    end: 1e-6
    pct_start: 0.1
    skip_scheduler: false
    weight_decay: 1e-5

  model:
    init_args:
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.experiments.cld.task.CLDTask
              init_args:
                name: reco
                dim: 256
                mask_attn: false
                has_intermediate_loss: true
                hits_included:
                  - trkr
                  - vtxd
                  - ecal
                  - hcal
                  - muon
                hit_mask_attn_thresholds: null
                tracker_helix_fit: false
                helix_fit_warmup_steps: 10000
                calo_line_fit: false
                calo_score_method: sigmoid
                loss_object_mask: valid
                hit_loss_weights:
                  vtxd: {mask_dice: 1.0, mask_bce: 0.5}
                  trkr: {mask_dice: 1.0, mask_bce: 0.5}
                  ecal: {mask_dice: 1.0, mask_bce: 0.5}
                  hcal: {mask_dice: 1.0, mask_bce: 0.5}
                  muon: {mask_dice: 1.0, mask_bce: 0.5}
                hit_cost_weights:
                  vtxd: {mask_dice: 1.0}
                  trkr: {mask_dice: 1.0}
                  ecal: {mask_dice: 1.0}
                  hcal: {mask_dice: 1.0}
                  muon: {mask_dice: 1.0}

            - class_path: hepattn.experiments.cld.trkfit.regrtask.ObjectPropertyRegressionTask
              init_args:
                name: flow_property_regression
                input_constituent: [vtxd, trkr]
                calo_constituents: [ecal, hcal]
                muon_constituents: [muon]
                input_object: query
                output_object: flow
                target_object: particle
                dim: 256
                loss: smooth_l1
                loss_weight: 1.0
                # v12e: GLS replaces Kendall. Manual head weights inert (gate_ce now in bulk GLS group).
                loss_combination: gls
                gls_priority_params: [inv_pt, energy_track, energy]
                gls_bulk_params: [d0, z0, phi0, eta, neutral_deta, neutral_dphi, gate_ce]
                use_per_param_kendall: false
                min_tracker_hits: 5
                seed_min_hits: 3
                loss_min_hits: 5
                min_calo_hits: 3
                use_split_calo: true
                use_helix_residuals: true
                pid_charged_classes: [2, 4, 5]
                use_full_perigee: true
                use_calo_head: true
                use_sagitta: true
                use_arcsinh: true
                use_outlier_masking: true
                outlier_percentile: 0.95
                use_aux_energy_loss: true
                neutral_energy_only: true
                neutral_calo_threshold: 0.1
                per_param_outlier_percentile:
                  inv_pt: 0.95
                  d0: 0.95
                  z0: 0.95
                  phi0: 0.95
                  eta: 0.95
                  energy_track: 0.95
                  energy: 0.95
                  neutral_deta: 0.95
                  neutral_dphi: 0.95
                target_mode: log_mad
                bin_stats_path: /share/gpu1/syw24/hepattn/src/hepattn/experiments/cld/configs/bin_stats_v12b_3k_ET_d0flip.yaml
                interp_mode: cubic
                use_barron_loss: true
                barron_alpha_init: 1.0
                barron_scale_init: 1.0
                barron_alpha_learnable: false
                barron_alpha_init_per_param:
                  eta: 0.5
                  energy_track: 0.5
                  inv_pt: 0.7
                  d0: 0.7
                  z0: 0.7
                  phi0: 0.7
                  neutral_deta: 0.7
                  neutral_dphi: 0.7
                  energy: 1.0
                use_binvar_features: true
                use_bin_stats_features: true
                split_track_head_per_param: true
                split_energy_head_per_param: true
                track_head_per_param_hidden: [32]
                energy_head_per_param_hidden: [32]
                add_v12b_scalars: true
                scalar_mlp_hidden: [128]
                scalar_mlp_output_dim: 128
                trunk_hidden_layers: [256, 256, 256, 256]
                track_adapter_hidden: [256, 128, 64]
                energy_adapter_hidden: [256, 128, 64]
                gate_adapter_hidden: [128, 64]
                track_head_hidden_layers: []
                energy_head_hidden_layers: []
                gate_head_hidden_layers: []
                dropout: 0.0
                energy_target: energy
                energy_bias_init: 0.0
                has_intermediate_loss: false
                permute_loss: true
                num_pid_classes: 6

trainer:
  max_epochs: 2
  val_check_interval: 200
  # v12e: no manual optimization (Kendall removed) → Trainer-level gradient clip applies.
  # 1.0 matches the property-regression historical convention (v12c/v11b/v8d).
  gradient_clip_val: 1.0
