name: CLD_Combined_Class_Slots_v0

matmul_precision: high

data:
  # Paths to preprocessed data directories
  train_dir: /share/rcif2/maxhart/data/cld/prepped/train/
  val_dir: /share/rcif2/maxhart/data/cld/prepped/val/
  test_dir: /share/rcif2/maxhart/data/cld/prepped/test/

  # Number of events to include in each set
  num_workers: 10
  num_train: -1
  num_test: 1000
  num_val: 100

  # Minibatch size / number of events used per training step
  batch_size: 10

  # Precision of any float values returned by the dataloader
  input_dtype: float32
  target_dtype: float32

  input_pad_value: 0.0
  target_pad_value: 0.0

  # Minimum pT for a particle to be deemed reconstructve in GeV
  particle_min_pt: 0.01
  particle_max_abs_eta: 4.0

  # Which particle classes to include as targets (null means include all)
  include_classes:
    - neutral_hadron
    - charged_hadron
    - photon
    - electron
    - muon

  # Events with more particles than this are skipped
  event_max_num_particles: &num_particles 336

  # Number of query slots / particles to generate per event
  force_pad_sizes:
    particle: *num_particles
    pandora: *num_particles
    sitrack: *num_particles

  skip_pad_items: []

  sampling_seed: 42

  # Charged particle cuts based on hit content
  charged_particle_min_num_hits:
    vtxd: 0
    trkr: 0
    sihit: 4

  # Charged particle cuts based on hit content
  charged_particle_max_num_hits:
    vtxd: 12
    trkr: 12
    sihit: 24

  particle_cut_veto_min_num_hits:
    ecal: 32
    hcal: 16

  # Cuts on minimum fraction of particle pT a hit should have
  particle_hit_min_p_ratio:
    vtxd: 0.01
    trkr: 0.01

  # Cuts on maximum deflection between subsequent hits
  particle_hit_deflection_cuts:
    vtxd:
      max_angle: 0.25
      max_angle_xy: -1
      max_angle_rz: -1
      num_passes: 8
    trkr:
      max_angle: 1.0
      max_angle_xy: -1
      max_angle_rz: -1
      num_passes: 12

  # Cuts on maximum distance between subsequent hit
  particle_hit_separation_cuts:
    vtxd:
      max_dist: 0.25
      num_passes: 8
    trkr:
      max_dist: 1.5
      num_passes: 12

  truth_filter_hits: []

  merge_inputs:
    vtxd:
      - vtb
      - vte

    trkr:
      - itb
      - ite
      - otb
      - ote

    sihit:
      - vtb
      - vte
      - itb
      - ite
      - otb
      - ote

    ecal:
      - ecb
      - ece

    hcal:
      - hcb
      - hce
      - hco

    muon:
      - msb
      - mse

  inputs:
    vtxd:
      - type
      - quality
      - pos.x
      - pos.y
      - pos.z
      - pos.s
      - pos.r
      - pos.x_dm
      - pos.y_dm
      - pos.z_dm
      - pos.s_dm
      - pos.r_dm
      - pos.theta
      - pos.eta
      - pos.phi
      - pos.sinphi
      - pos.cosphi
      - pos.u
      - pos.v
      - eDep
      - eDepError
      - time
      - u.a
      - u.b
      - v.a
      - v.b
      - du
      - dv

    trkr:
      - type
      - quality
      - pos.x
      - pos.y
      - pos.z
      - pos.s
      - pos.r
      - pos.theta
      - pos.eta
      - pos.phi
      - pos.sinphi
      - pos.cosphi
      - pos.u
      - pos.v
      - eDep
      - eDepError
      - time
      - u.a
      - u.b
      - v.a
      - v.b
      - du
      - dv

    sihit:
      - type

    ecal:
      - type
      - pos.x
      - pos.y
      - pos.z
      - pos.s
      - pos.r
      - pos.theta
      - pos.eta
      - pos.phi
      - pos.sinphi
      - pos.cosphi
      - pos.u
      - pos.v
      - energy
      - log_energy
      - energyError
      - time

    hcal:
      - type
      - pos.x
      - pos.y
      - pos.z
      - pos.s
      - pos.r
      - pos.theta
      - pos.eta
      - pos.phi
      - pos.sinphi
      - pos.cosphi
      - pos.u
      - pos.v
      - energy
      - log_energy
      - energyError
      - time

    muon:
      - type
      - pos.x
      - pos.y
      - pos.z
      - pos.s
      - pos.r
      - pos.theta
      - pos.eta
      - pos.phi
      - pos.sinphi
      - pos.cosphi
      - pos.u
      - pos.v
      - energy
      - log_energy
      - energyError
      - time

  targets:
    particle:
      - PDG
      - charge
      - time
      - mass
      - energy
      # Particle creation vertex coordinates
      - vtx.x
      - vtx.y
      - vtx.z
      - vtx.r
      # Production momentum coordinates
      - mom.x
      - mom.y
      - mom.z
      - mom.r
      - mom.eta
      - mom.abs_eta
      - mom.phi
      - mom.theta
      - mom.sinphi
      - mom.cosphi
      - mom.rinv
      - mom.qopt
      # Spin coordinates
      - spin.x
      - spin.y
      - spin.z
      # Constituent count info
      - num_vtxd
      - num_trkr
      - num_ecal
      - num_hcal
      - num_sihit
      - num_muon
      # Angular isolation
      - isolation
      # Calorimeter energy info
      - energy_ecal
      - energy_hcal
      - calib_energy_ecal
      - calib_energy_hcal
      - calib_energy_calo
      # Binary particle class info
      - is_charged
      - is_neutral
      - is_neutral_hadron
      - is_charged_hadron
      - is_photon
      - is_electron
      - is_muon
      - is_tau
      - is_neutrino
      - is_other
      - is_primary
      - is_secondary
      - class_idx


    particle_vtxd:
      - pos.x
      - pos.y
      - pos.z
      - pos.r
      - pos.theta
      - pos.phi
      - mom.x
      - mom.y
      - mom.z
      - mom.r
      - mom.rinv
      - mom.theta
      - mom.phi

    particle_trkr:
      - pos.x
      - pos.y
      - pos.z
      - pos.r
      - pos.theta
      - pos.phi
      - mom.x
      - mom.y
      - mom.z
      - mom.r
      - mom.rinv
      - mom.theta
      - mom.phi

    particle_ecal:
      - energy
      - energy_frac
      - log_energy

    particle_hcal:
      - energy
      - energy_frac
      - log_energy

    particle_muon:
      - energy

    # Pandora reconstruction info
    pandora:
      - PDG
      - charge
      - ref.x
      - ref.y
      - ref.z
      - ref.r
      - mom.x
      - mom.y
      - mom.z
      - mom.r
      - mom.eta
      - mom.abs_eta
      - is_charged
      - is_neutral

    pandora_vtxd: []

    pandora_trkr: []

    pandora_ecal: []

    pandora_hcal: []

    pandora_muon: []

    # Conformal tracking info
    sitrack:
      - type
      - chi2
      - ndf

    sitrack_vtxd: []

    sitrack_trkr: []

# Training stuff here
trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 10
  val_check_interval: 1000
  default_root_dir: logs
  accumulate_grad_batches: 1
  enable_progress_bar: True

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: cld

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        every_n_train_steps: 5000
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10
    - class_path: hepattn.callbacks.GradConflictLogger
      init_args:
        log_every_n_steps: 100

model:
  optimizer: lion

  lrs_config:
    initial: 1e-5
    max: 5e-5
    end: 1e-5
    pct_start: 0.001
    skip_scheduler: false
    weight_decay: 1e-5
    gradient_clip_val: 0.1

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      dim: &dim 256
      input_sort_field: pos.theta
      common_decoder_dense: false

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: vtxd
                input_dtype: float32
                fields:
                  - pos.x_dm
                  - pos.y_dm
                  - pos.z_dm
                  - pos.s_dm
                  - pos.r_dm
                  - pos.theta
                  - pos.phi
                  - u.a
                  - u.b
                  - v.a
                  - v.b
                  - du
                  - dv
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 13
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.PositionEncoder
                  init_args:
                    input_name: vtxd
                    dim: *dim
                    fields:
                      - pos.x_dm
                      - pos.y_dm
                      - pos.z_dm
                      - pos.r_dm
                      - pos.theta
                      - pos.phi

            - class_path: hepattn.models.InputNet
              init_args:
                input_name: trkr
                input_dtype: float32
                fields:
                  - pos.x
                  - pos.y
                  - pos.z
                  - pos.s
                  - pos.r
                  - pos.theta
                  - pos.phi
                  - u.a
                  - u.b
                  - v.a
                  - v.b
                  - du
                  - dv
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 13
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.PositionEncoder
                  init_args:
                    input_name: trkr
                    dim: *dim
                    fields:
                      - pos.x
                      - pos.y
                      - pos.z
                      - pos.r
                      - pos.theta
                      - pos.phi

            - class_path: hepattn.models.InputNet
              init_args:
                input_name: ecal
                input_dtype: float32
                fields:
                  - pos.x
                  - pos.y
                  - pos.z
                  - pos.s
                  - pos.r
                  - pos.theta
                  - pos.phi
                  - log_energy
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 8
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.PositionEncoder
                  init_args:
                    input_name: ecal
                    dim: *dim
                    fields:
                      - pos.x
                      - pos.y
                      - pos.z
                      - pos.r
                      - pos.theta
                      - pos.phi

            - class_path: hepattn.models.InputNet
              init_args:
                input_name: hcal
                input_dtype: float32
                fields:
                  - pos.x
                  - pos.y
                  - pos.z
                  - pos.s
                  - pos.r
                  - pos.theta
                  - pos.phi
                  - log_energy
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 8
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.PositionEncoder
                  init_args:
                    input_name: hcal
                    dim: *dim
                    fields:
                      - pos.x
                      - pos.y
                      - pos.z
                      - pos.r
                      - pos.theta
                      - pos.phi

            - class_path: hepattn.models.InputNet
              init_args:
                input_name: muon
                input_dtype: float32
                fields:
                  - pos.x
                  - pos.y
                  - pos.z
                  - pos.s
                  - pos.r
                  - pos.theta
                  - pos.phi
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 7
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.PositionEncoder
                  init_args:
                    input_name: muon
                    dim: *dim
                    fields:
                      - pos.x
                      - pos.y
                      - pos.z
                      - pos.r
                      - pos.theta
                      - pos.phi

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: *dim
          attn_type: flash-varlen
          window_size: 4096
          window_wrap: false
          hybrid_norm: true
          norm: CustomLayerNorm
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      decoder:
        num_decoder_layers: 4
        num_queries: *num_particles
        mask_attention: true
        use_query_masks: false
        mask_attention: true
        use_query_masks: false
        unmask_all_false: true
        decoder_layer_config:
          dim: *dim
          norm: CustomLayerNorm
          hybrid_norm: true
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: false

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.experiments.cld.task.CLDTask
              init_args:
                name: reco
                dim: *dim
                mask_attn: false
                has_intermediate_loss: true
                hits_included:
                  - trkr
                  - vtxd
                  - ecal
                  - hcal
                  - muon
                hit_mask_attn_thresholds: null
                tracker_helix_fit: false
                helix_fit_warmup_steps: 10000
                calo_line_fit: false
                calo_score_method: sigmoid
                loss_object_mask: valid
                sihit_gated_calo_cost: true
                hit_loss_weights:
                  vtxd: {mask_dice: 1.0, mask_bce: 0.5}
                  trkr: {mask_dice: 1.0, mask_bce: 0.5}
                  ecal: {mask_dice: 1.0, mask_bce: 0.5}
                  hcal: {mask_dice: 1.0, mask_bce: 0.5}
                  muon: {mask_dice: 1.0, mask_bce: 0.5}
                # Charged particles matched by sihit only; neutrals matched by calo only
                hit_cost_classes:
                  sihit: [charged_hadron, electron, muon]
                  ecal: [neutral_hadron, photon]
                  hcal: [neutral_hadron]
                  muon: [muon]
                hit_cost_weights:
                  sihit: {mask_dice: 1.0}
                  ecal: {mask_recall: 1.0}
                  hcal: {mask_recall: 1.0}
                  muon: {mask_recall: 1.0}
                # Per-class query slot reservations (no unconstrained slots)
                # Layout: [0,128)=charged_hadron [128,256)=photon [256,288)=neutral_hadron
                #         [288,320)=electron [320,336)=muon  (total=336)
                class_query_slots:
                  charged_hadron: [0, 128]
                  photon: [128, 256]
                  neutral_hadron: [256, 288]
                  electron: [288, 320]
                  muon: [320, 336]
                # Class is determined by slot; class_net only predicts valid/null
                use_slot_class: true
