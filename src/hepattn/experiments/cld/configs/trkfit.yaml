name: CLD_TrkFit_v0

matmul_precision: high

data:
  train_dir: /share/rcif2/maxhart/data/cld/prepped/train/
  val_dir: /share/rcif2/maxhart/data/cld/prepped/val/
  test_dir: /share/rcif2/maxhart/data/cld/prepped/test/

  num_workers: 6
  num_train: 100000
  num_test: 1000
  num_val: 100

  # Tracks from all events in the batch are concatenated into one flat list.
  # Larger batches give better EMA estimates and improve GPU utilisation.
  batch_size: 4

  input_dtype: float32
  target_dtype: float32
  input_pad_value: 0.0
  target_pad_value: 0.0

  sampling_seed: 42

  # Particle selection (only used for building truth-matching targets, not filtering tracks)
  particle_min_pt: 0.1
  particle_max_abs_eta: 4.0

  include_classes:
    - charged_hadron
    - electron
    - muon

  event_max_num_particles: 384

  charged_particle_min_num_hits:
    vtxd: 0
    trkr: 0
    sihit: 4

  charged_particle_max_num_hits:
    vtxd: 12
    trkr: 12
    sihit: 24

  particle_cut_veto_min_num_hits:
    ecal: 32
    hcal: 16

  particle_hit_min_p_ratio:
    vtxd: 0.01
    trkr: 0.01

  particle_hit_deflection_cuts:
    vtxd:
      max_angle: 0.25
      max_angle_xy: -1
      max_angle_rz: -1
      num_passes: 8
    trkr:
      max_angle: 1.0
      max_angle_xy: -1
      max_angle_rz: -1
      num_passes: 12

  particle_hit_separation_cuts:
    vtxd:
      max_dist: 0.25
      num_passes: 8
    trkr:
      max_dist: 1.5
      num_passes: 12

  truth_filter_hits: []

  merge_inputs:
    vtxd:
      - vtb
      - vte
    trkr:
      - itb
      - ite
      - otb
      - ote
    sihit:
      - vtb
      - vte
      - itb
      - ite
      - otb
      - ote
    ecal:
      - ecb
      - ece
    hcal:
      - hcb
      - hce
      - hco

  inputs:
    vtxd:
      - pos.x
      - pos.y
      - pos.z
      - pos.r
      - pos.s
      - pos.theta
      - pos.phi
      - type
      - time
    trkr:
      - pos.x
      - pos.y
      - pos.z
      - pos.r
      - pos.s
      - pos.theta
      - pos.phi
      - type
      - time
    sihit:
      - type
    ecal:
      - type
      - energy
    hcal:
      - type
      - energy

  targets:
    pandora:
      - mom.theta
      - mom.phi
      - mom.qopt
      - perigee.d0
      - perigee.z0
      - charge
      - is_charged
    pandora_vtxd: []
    pandora_trkr: []
    pandora_ecal: []
    pandora_hcal: []

    particle:
      - mom.theta
      - mom.phi
      - mom.qopt
      - perigee.d0
      - perigee.z0
    particle_vtxd:
      - mom.x
      - mom.y
      - mom.z
    particle_trkr:
      - mom.x
      - mom.y
      - mom.z
    particle_ecal:
      - energy
    particle_hcal:
      - energy

trainer:
  max_epochs: 25
  accelerator: gpu
  devices: 1
  precision: 64-true
  log_every_n_steps: 100
  default_root_dir: logs
  val_check_interval: 2000
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  enable_progress_bar: true

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: cld

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.experiments.cld.trkfit.callback.TrackResidualPlotCallback
      init_args:
        max_events: 100
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        every_n_train_steps: 5000
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10

model:
  optimizer: lion

  lrs_config:
    initial: 1e-5
    max: 1e-4
    end: 1e-5
    pct_start: 0.01
    skip_scheduler: false
    weight_decay: 1e-2

  mtl: false

  model:
    class_path: hepattn.models.BoostedTrackFitter
    init_args:
      dim: &dim 128
      B_field: 2.0          # CLD solenoid [T]
      fields: &fields
        - theta
        - phi_perigee
        - qopt
        - d0_perigee_m
        - z0_perigee_m
      angular_fields:
        - phi_perigee

      n_stages: 1
      n_cross_heads: 4
      n_stage_layers: 4
      norm: FastLayerNorm

      inject_params: true
      detach_stages: false

      normalize_loss: true
      ema_momentum: 0.95
      # ema_init sets BOTH the EMA loss scale AND field_unit_scales (delta output scale).
      # Must equal the actual helix-vs-truth residual MAD so that:
      #   - loss starts at arcsinh(1.48) ≈ 1.23 immediately (no warm-up lag)
      #   - delta * field_unit_scales gives physical corrections at the right scale
      ema_init:
        theta:        0.003    # helix theta MAD [rad]
        phi_perigee:  0.002    # helix phi MAD [rad]
        qopt:         0.02     # helix q/pT MAD [GeV^-1]
        d0_perigee_m: 0.0003   # helix d0 MAD [m] = 0.3 mm
        z0_perigee_m: 0.001    # helix z0 MAD [m] = 1 mm

      # Scale of the delta_head final-layer init.  Larger values give stronger
      # gradient signal to the encoder early in training (faster convergence).
      # 0.01 gives initial corrections ~20% of Pandora MAD at step 0.
      delta_head_init_std: 0.01

      # Separate scales for normalising helix params into param_proj/param_inject.
      # Must reflect TYPICAL PARAMETER MAGNITUDES (not residual MADs) so that
      # the MLP receives O(1) inputs.
      param_proj_scales:
        theta:        1.0      # |theta| ~ 0-pi
        phi_perigee:  1.0      # |phi| ~ 0-π
        qopt:         1.0      # |qopt| ~ 0-10 for pT > 0.1 GeV
        d0_perigee_m: 0.001    # |d0| ~ 0-5 mm
        z0_perigee_m: 0.01     # |z0| ~ 0-50 mm (helix fit can be noisy)

      stage_loss_weight: 2.0
      trim_fraction: 0.1

      loss_type: arcsinh_mad
      field_combination: geometric
      barron_learn_scale: false
      welsch_c: 1.0

      use_relative_coords: true
      use_sagitta: false

      field_loss_weights:
        theta:        5.0
        phi_perigee:  10.0
        qopt:         5.0
        d0_perigee_m: 1.0
        z0_perigee_m: 15.0

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet  # vtxd (pixel) hits
              init_args:
                input_name: vtxd
                input_dtype: float32
                fields:
                  - x
                  - y
                  - z
                  - r
                  - s
                  - theta
                  - phi
                  - dtheta
                  - dphi
                  - x_prime
                  - y_prime
                  - dz_signed
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 12
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.PositionEncoder
                  init_args:
                    input_name: vtxd
                    dim: *dim
                    fields:
                      - r
                      - theta
                      - phi
            - class_path: hepattn.models.InputNet  # trkr (strip) hits
              init_args:
                input_name: trkr
                input_dtype: float32
                fields:
                  - x
                  - y
                  - z
                  - r
                  - s
                  - theta
                  - phi
                  - dtheta
                  - dphi
                  - x_prime
                  - y_prime
                  - dz_signed
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 12
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.PositionEncoder
                  init_args:
                    input_name: trkr
                    dim: *dim
                    fields:
                      - r
                      - theta
                      - phi

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 4
          dim: *dim
          attn_type: torch
          norm: FastLayerNorm
          hybrid_norm: true
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.experiments.cld.trkfit.task.CLDTrackTask
              init_args:
                name: track_params
                output_object: track
                target_object: track_matched_particle
                fields: *fields
                angular_fields:
                  - phi_perigee
