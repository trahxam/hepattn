name: CLD_5_320_10MeV_charged_tracking

data:
  # We are doing just tracking, so only include charged targets
  include_neutral: false

model:
  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      dim: &dim 256
      input_sort_field: pos.phi

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: vtxd
                input_dtype: float32
                fields:
                  - pos.x
                  - pos.y
                  - pos.z
                  - pos.s
                  - pos.r
                  - pos.theta
                  - pos.phi
                  - u.a
                  - u.b
                  - v.a
                  - v.b
                  - du
                  - dv
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 13
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: vtxd
                    dim: *dim
                    fields:
                      - pos.x
                      - pos.y
                      - pos.z
                      - pos.r
                      - pos.theta
                      - pos.phi

            - class_path: hepattn.models.InputNet
              init_args:
                input_name: trkr
                input_dtype: float32
                fields:
                  - pos.x
                  - pos.y
                  - pos.z
                  - pos.s
                  - pos.r
                  - pos.theta
                  - pos.phi
                  - u.a
                  - u.b
                  - v.a
                  - v.b
                  - du
                  - dv
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 13
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: trkr
                    dim: *dim
                    fields:
                      - pos.x
                      - pos.y
                      - pos.z
                      - pos.r
                      - pos.theta
                      - pos.phi

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: flow_valid
                input_object: query
                output_object: flow
                target_object: particle
                losses:
                  object_bce: 0.1
                costs:
                  object_bce: 1.0
                dim: *dim
                null_weight: 1.0
                mask_queries: false
                has_intermediate_loss: False

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_vtxd_assignment
                input_constituent: vtxd
                input_object: query
                output_object: flow
                target_object: particle
                has_intermediate_loss: False
                losses:
                  mask_bce: 0.25
                  mask_dice: 0.75
                  #mask_focal: 1.0
                costs:
                  #mask_bce: 1.0
                  mask_dice: 1.0
                  #mask_focal: 1.0
                dim: *dim
                null_weight: 1.0

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: flow_trkr_assignment
                input_constituent: trkr
                input_object: query
                output_object: flow
                target_object: particle
                has_intermediate_loss: False
                losses:
                  mask_bce: 0.25
                  mask_dice: 0.75
                  #mask_focal: 1.0
                costs:
                  #mask_bce: 1.0
                  mask_dice: 1.0
                  #mask_focal: 1.0
                dim: *dim
                null_weight: 1.0
