model:
  model:
    class_path: hepattn.models.fitter.Fitter
    init_args:
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: particle_vtxd
                input_dtype: float32
                fields:
                  - pos.x
                  - pos.y
                  - pos.z
                  - pos.s
                  - pos.r
                  - pos.theta
                  - pos.phi
                  - u.a
                  - u.b
                  - v.a
                  - v.b
                  - du
                  - dv
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 13
                    output_size: &dim 256
                posenc:
                  class_path: hepattn.models.posenc.SphericalHarmonicEncoder
                  init_args:
                    input_name: particle_vtxd
                    dim: *dim
                    phi_field: pos.phi
                    theta_field: pos.theta
                    radius_field: pos.r

            - class_path: hepattn.models.InputNet
              init_args:
                input_name: particle_trkr
                input_dtype: float32
                fields:
                  - pos.x
                  - pos.y
                  - pos.z
                  - pos.s
                  - pos.r
                  - pos.theta
                  - pos.phi
                  - u.a
                  - u.b
                  - v.a
                  - v.b
                  - du
                  - dv
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 13
                    output_size: *dim
                posenc:
                  class_path: hepattn.models.posenc.SphericalHarmonicEncoder
                  init_args:
                    input_name: particle_trkr
                    dim: *dim
                    phi_field: pos.phi
                    theta_field: pos.theta
                    radius_field: pos.r
