settings:
  runs:
    - path: /share/rcifdata/maxhart/hepattn/src/hepattn/experiments/cld/logs/All_20260202-T181849/ckpts/epoch=000-val_loss=17.18311_test_eval.h5
      label: Combined
      color: mediumvioletred
    - path: /share/rcifdata/maxhart/hepattn/src/hepattn/experiments/cld/logs/TrackingFixed_20260205-T000653/ckpts/epoch=000-val_loss=7.40857_test_eval.h5
      label: Tracking
      color: dodgerblue

  hits: [vtxd, trkr, ecal, hcal, muon]
  hits_no_muon: [vtxd, trkr, ecal, hcal]
  comet_hits: [sihit, vtxd, trkr]
  comet_working_points: [0.5, 0.75, 1.0]
  pred_objects: [flow]
  binary_metrics_match_mode: matched
  use_flow_class_logits_for_pid: true
  flow_valid_prob_threshold: 0.5
  max_events: 1000
  base_data_cache_max_events: 1000
  cache_base_data: true
  save_comparison_plots: true
  comparison_plot_dir: src/hepattn/experiments/cld/plots/eval_tracking_compare
  min_bin_count: 16
  trim_xrange_to_valid_bins: true

  tracking_only:
    run_label: Tracking
    baseline_label: Combined
    metric: charged_reconstructed
    selection: charged_reconstructable_loose

  reco_density:
    enabled: true
    metric: charged_reconstructed
    selection: charged_reconstructable_loose
    normalize: true
    output_subdir: reco_density_hists
    vars:
      pt:
        field: particle_mom.r
        bins: pt_100mev
        xlabel: 'Truth Particle $p_T$ [GeV]'
      eta:
        field: particle_mom.eta
        bins: eta
        xlabel: Truth Particle Pseudorapidity
      phi:
        field: particle_mom.phi
        bins: phi
        xlabel: 'Truth Particle $\phi$'
      vtx_r:
        field: particle_vtx.r
        bins: vtx_r_50mm
        xlabel: 'Truth Particle Vertex $r$ [mm]'
      num_sihit:
        field: particle_num_sihit
        bins: num_sihit
        xlabel: Truth Particle Number of Silicon Hits
      num_vtxd:
        field: particle_num_vtxd
        bins: num_vtxd
        xlabel: Truth Particle Number of VTXD Hits
      num_trkr:
        field: particle_num_trkr
        bins: num_trkr
        xlabel: Truth Particle Number of Tracker Hits
      num_ecal:
        field: particle_num_ecal
        bins: num_ecal
        xlabel: Truth Particle Number of ECAL Hits
      num_hcal:
        field: particle_num_hcal
        bins: num_hcal
        xlabel: Truth Particle Number of HCAL Hits
      isolation:
        field: particle_isolation
        bins: isolation_full
        xlabel: Truth Particle Isolation

  tracking_only_truth_hist:
    enabled: true
    normalize: true
    show_errors: true
    colors:
      all_truth: tab:green
      all_truth_charged: tab:orange
      tracking_only_missed: tab:blue
    output_subdir: tracking_only_truth_hists

eval:
  # Matching is only used to align flow query slots with truth particles.
  # Reconstruction requirements below use only silicon-hit eff/pur (not IoU).
  match_metrics:
    default:
      vtxd:
        weight: 1.0
        metric: dice
        field: valid

      trkr:
        weight: 1.0
        metric: dice
        field: valid

  # Single-hit reconstruction requirement used everywhere:
  # reconstructed := (sihit_eff >= 0.5) AND (sihit_pur >= 0.5)
  binary_metrics:
    charged_reconstructed:
      - hit: sihit
        thresh: 0.5
        metric: eff
        field: valid
      - hit: sihit
        thresh: 0.5
        metric: pur
        field: valid

    charged_hadron_reconstructed:
      - hit: sihit
        thresh: 0.5
        metric: eff
        field: valid
      - hit: sihit
        thresh: 0.5
        metric: pur
        field: valid

    electron_reconstructed:
      - hit: sihit
        thresh: 0.5
        metric: eff
        field: valid
      - hit: sihit
        thresh: 0.5
        metric: pur
        field: valid

    muon_reconstructed:
      - hit: sihit
        thresh: 0.5
        metric: eff
        field: valid
      - hit: sihit
        thresh: 0.5
        metric: pur
        field: valid

    # Comet-style hit-level thresholds (eff/pur).
    p0.5_sihit_eff:
      - hit: sihit
        thresh: 0.5
        metric: eff
        field: valid

    p0.5_sihit_pur:
      - hit: sihit
        thresh: 0.5
        metric: pur
        field: valid

    p0.75_sihit_eff:
      - hit: sihit
        thresh: 0.75
        metric: eff
        field: valid

    p0.75_sihit_pur:
      - hit: sihit
        thresh: 0.75
        metric: pur
        field: valid

    p1.0_sihit_eff:
      - hit: sihit
        thresh: 0.99
        metric: eff
        field: valid

    p1.0_sihit_pur:
      - hit: sihit
        thresh: 0.99
        metric: pur
        field: valid

    p0.5_vtxd_eff:
      - hit: vtxd
        thresh: 0.5
        metric: eff
        field: valid

    p0.5_vtxd_pur:
      - hit: vtxd
        thresh: 0.5
        metric: pur
        field: valid

    p0.75_vtxd_eff:
      - hit: vtxd
        thresh: 0.75
        metric: eff
        field: valid

    p0.75_vtxd_pur:
      - hit: vtxd
        thresh: 0.75
        metric: pur
        field: valid

    p1.0_vtxd_eff:
      - hit: vtxd
        thresh: 0.99
        metric: eff
        field: valid

    p1.0_vtxd_pur:
      - hit: vtxd
        thresh: 0.99
        metric: pur
        field: valid

    p0.5_trkr_eff:
      - hit: trkr
        thresh: 0.5
        metric: eff
        field: valid

    p0.5_trkr_pur:
      - hit: trkr
        thresh: 0.5
        metric: pur
        field: valid

    p0.75_trkr_eff:
      - hit: trkr
        thresh: 0.75
        metric: eff
        field: valid

    p0.75_trkr_pur:
      - hit: trkr
        thresh: 0.75
        metric: pur
        field: valid

    p1.0_trkr_eff:
      - hit: trkr
        thresh: 0.99
        metric: eff
        field: valid

    p1.0_trkr_pur:
      - hit: trkr
        thresh: 0.99
        metric: pur
        field: valid

  # Tight/loose only refers to truth selections/denominators.
  selections:
    charged_reconstructable_tight:
      - is_primary
      - "mom.r >= 0.1"
      - "mom.abs_eta <= 2.44"
      - "vtx.r <= 50"
      - "num_sihit >= 4"
      - "isolation >= 0.02"

    charged_reconstructable_loose:
      - "num_sihit >= 3"

    charged_hadron_reconstructable_tight:
      - is_charged_hadron
      - is_primary
      - "mom.r >= 0.1"
      - "mom.abs_eta <= 2.44"
      - "vtx.r <= 50"
      - "num_sihit >= 4"
      - "isolation >= 0.02"

    charged_hadron_reconstructable_loose:
      - is_charged_hadron
      - "num_sihit >= 3"

    electron_reconstructable_tight:
      - is_electron
      - is_primary
      - "mom.r >= 0.1"
      - "mom.abs_eta <= 2.44"
      - "vtx.r <= 50"
      - "num_sihit >= 4"
      - "isolation >= 0.02"

    electron_reconstructable_loose:
      - is_electron
      - "num_sihit >= 3"

    muon_reconstructable_tight:
      - is_muon
      - is_primary
      - "mom.r >= 0.1"
      - "mom.abs_eta <= 2.44"
      - "vtx.r <= 50"
      - "num_sihit >= 4"
      - "isolation >= 0.02"

    muon_reconstructable_loose:
      - is_muon
      - "num_sihit >= 3"

  residual_metrics: {}
  residual_histograms: {}
  residual_histogram_plots: {}

  bins:
    pt_100mev:
      min: 0.01
      max: 100.0
      num: 24
      scale: log

    vtx_r_50mm:
      min: 0
      max: 50
      num: 24
      scale: linear

    num_vtxd:
      min: -0.5
      max: 11.5
      num: 13
      scale: linear

    num_trkr:
      min: -0.5
      max: 11.5
      num: 13
      scale: linear

    num_sihit:
      min: -0.5
      max: 24.5
      num: 26
      scale: linear

    num_ecal:
      min: 1
      max: 1000
      num: 32
      scale: log

    num_hcal:
      min: 1
      max: 500
      num: 32
      scale: log

    isolation_full:
      min: 0.00001
      max: 3.14
      num: 24
      scale: log

    eta:
      min: -2.5
      max: 2.5
      num: 32
      scale: linear

    phi:
      min: -3.14159
      max: 3.14159
      num: 32
      scale: linear

  # Bulk metrics: only flow, since we compare "All" vs "Tracking" runs externally (eval_old EVAL_RUNS).
  bulk_metrics:
    flow_charged_eff_tight:
      object_name: particle
      selection: charged_reconstructable_tight
      denominator: charged_reconstructable_tight
      numerator: flow_charged_reconstructed

    flow_charged_eff_loose:
      object_name: particle
      selection: charged_reconstructable_loose
      denominator: charged_reconstructable_loose
      numerator: flow_charged_reconstructed

    flow_charged_hadron_eff_tight:
      object_name: particle
      selection: charged_hadron_reconstructable_tight
      denominator: charged_hadron_reconstructable_tight
      numerator: flow_charged_hadron_reconstructed

    flow_charged_hadron_eff_loose:
      object_name: particle
      selection: charged_hadron_reconstructable_loose
      denominator: charged_hadron_reconstructable_loose
      numerator: flow_charged_hadron_reconstructed

    flow_electron_eff_tight:
      object_name: particle
      selection: electron_reconstructable_tight
      denominator: electron_reconstructable_tight
      numerator: flow_electron_reconstructed

    flow_electron_eff_loose:
      object_name: particle
      selection: electron_reconstructable_loose
      denominator: electron_reconstructable_loose
      numerator: flow_electron_reconstructed

    flow_muon_eff_tight:
      object_name: particle
      selection: muon_reconstructable_tight
      denominator: muon_reconstructable_tight
      numerator: flow_muon_reconstructed

    flow_muon_eff_loose:
      object_name: particle
      selection: muon_reconstructable_loose
      denominator: muon_reconstructable_loose
      numerator: flow_muon_reconstructed

    flow_charged_pur:
      object_name: flow
      selection: is_charged
      denominator: is_charged
      numerator: particle_charged_reconstructed

    flow_charged_hadron_pur:
      object_name: flow
      selection: is_charged_hadron
      denominator: is_charged_hadron
      numerator: particle_charged_hadron_reconstructed

    flow_electron_pur:
      object_name: flow
      selection: is_electron
      denominator: is_electron
      numerator: particle_electron_reconstructed

    flow_muon_pur:
      object_name: flow
      selection: is_muon
      denominator: is_muon
      numerator: particle_muon_reconstructed

    # Comet-style bulk metrics (hit-level thresholds).
    flow_p0.5_sihit_eff:
      object_name: particle
      selection: num_sihit
      denominator: valid
      numerator: flow_p0.5_sihit_eff

    flow_p0.5_sihit_pur:
      object_name: flow
      selection: num_sihit
      denominator: valid
      numerator: particle_p0.5_sihit_pur

    flow_p0.75_sihit_eff:
      object_name: particle
      selection: num_sihit
      denominator: valid
      numerator: flow_p0.75_sihit_eff

    flow_p0.75_sihit_pur:
      object_name: flow
      selection: num_sihit
      denominator: valid
      numerator: particle_p0.75_sihit_pur

    flow_p1.0_sihit_eff:
      object_name: particle
      selection: num_sihit
      denominator: valid
      numerator: flow_p1.0_sihit_eff

    flow_p1.0_sihit_pur:
      object_name: flow
      selection: num_sihit
      denominator: valid
      numerator: particle_p1.0_sihit_pur

    flow_p0.5_vtxd_eff:
      object_name: particle
      selection: num_vtxd
      denominator: valid
      numerator: flow_p0.5_vtxd_eff

    flow_p0.5_vtxd_pur:
      object_name: flow
      selection: num_vtxd
      denominator: valid
      numerator: particle_p0.5_vtxd_pur

    flow_p0.75_vtxd_eff:
      object_name: particle
      selection: num_vtxd
      denominator: valid
      numerator: flow_p0.75_vtxd_eff

    flow_p0.75_vtxd_pur:
      object_name: flow
      selection: num_vtxd
      denominator: valid
      numerator: particle_p0.75_vtxd_pur

    flow_p1.0_vtxd_eff:
      object_name: particle
      selection: num_vtxd
      denominator: valid
      numerator: flow_p1.0_vtxd_eff

    flow_p1.0_vtxd_pur:
      object_name: flow
      selection: num_vtxd
      denominator: valid
      numerator: particle_p1.0_vtxd_pur

    flow_p0.5_trkr_eff:
      object_name: particle
      selection: num_trkr
      denominator: valid
      numerator: flow_p0.5_trkr_eff

    flow_p0.5_trkr_pur:
      object_name: flow
      selection: num_trkr
      denominator: valid
      numerator: particle_p0.5_trkr_pur

    flow_p0.75_trkr_eff:
      object_name: particle
      selection: num_trkr
      denominator: valid
      numerator: flow_p0.75_trkr_eff

    flow_p0.75_trkr_pur:
      object_name: flow
      selection: num_trkr
      denominator: valid
      numerator: particle_p0.75_trkr_pur

    flow_p1.0_trkr_eff:
      object_name: particle
      selection: num_trkr
      denominator: valid
      numerator: flow_p1.0_trkr_eff

    flow_p1.0_trkr_pur:
      object_name: flow
      selection: num_trkr
      denominator: valid
      numerator: particle_p1.0_trkr_pur

  histograms:
    # Charged efficiency vs truth variables (tight/loose selections)
    flow_charged_pt_tight:
      object_name: particle
      field: mom.r
      bins: pt_100mev
      selection: charged_reconstructable_tight
      denominator: charged_reconstructable_tight
      numerator: flow_charged_reconstructed

    flow_charged_pt_loose:
      object_name: particle
      field: mom.r
      bins: pt_100mev
      selection: charged_reconstructable_loose
      denominator: charged_reconstructable_loose
      numerator: flow_charged_reconstructed

    flow_charged_eta_tight:
      object_name: particle
      field: mom.eta
      bins: eta
      selection: charged_reconstructable_tight
      denominator: charged_reconstructable_tight
      numerator: flow_charged_reconstructed

    flow_charged_eta_loose:
      object_name: particle
      field: mom.eta
      bins: eta
      selection: charged_reconstructable_loose
      denominator: charged_reconstructable_loose
      numerator: flow_charged_reconstructed

    flow_charged_phi_tight:
      object_name: particle
      field: mom.phi
      bins: phi
      selection: charged_reconstructable_tight
      denominator: charged_reconstructable_tight
      numerator: flow_charged_reconstructed

    flow_charged_phi_loose:
      object_name: particle
      field: mom.phi
      bins: phi
      selection: charged_reconstructable_loose
      denominator: charged_reconstructable_loose
      numerator: flow_charged_reconstructed

    flow_charged_vtx_r_tight:
      object_name: particle
      field: vtx.r
      bins: vtx_r_50mm
      selection: charged_reconstructable_tight
      denominator: charged_reconstructable_tight
      numerator: flow_charged_reconstructed

    flow_charged_vtx_r_loose:
      object_name: particle
      field: vtx.r
      bins: vtx_r_50mm
      selection: charged_reconstructable_loose
      denominator: charged_reconstructable_loose
      numerator: flow_charged_reconstructed

    flow_charged_num_sihit_tight:
      object_name: particle
      field: num_sihit
      bins: num_sihit
      selection: charged_reconstructable_tight
      denominator: charged_reconstructable_tight
      numerator: flow_charged_reconstructed

    flow_charged_num_sihit_loose:
      object_name: particle
      field: num_sihit
      bins: num_sihit
      selection: charged_reconstructable_loose
      denominator: charged_reconstructable_loose
