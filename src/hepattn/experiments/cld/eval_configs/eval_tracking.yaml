eval:
  # Define metrics which give a score between pairs of objects which can
  # be used to match the objects to eachother
  match_metrics:
    default:
      sihit:
        weight: 1.0
        metric: dice
        field: valid

  # Define binary metrics which evaluate to true if all of its conditions are met
  binary_metrics:
    charged_reconstructed_tight:
      - hit: sihit
        thresh: 0.5
        metric: eff
        field: valid

      - hit: sihit
        thresh: 0.5
        metric: pur
        field: valid

    charged_reconstructed_loose:
      - hit: sihit
        thresh: 0.75
        metric: pur
        field: valid

    charged_hadron_reconstructed_tight:
      - hit: sihit
        thresh: 0.5
        metric: eff
        field: valid

      - hit: sihit
        thresh: 0.5
        metric: pur
        field: valid

    charged_hadron_reconstructed_loose:
      - hit: sihit
        thresh: 0.75
        metric: pur
        field: valid

    electron_reconstructed_tight:
      - hit: sihit
        thresh: 0.5
        metric: eff
        field: valid

      - hit: sihit
        thresh: 0.5
        metric: pur
        field: valid

    electron_reconstructed_loose:
      - hit: sihit
        thresh: 0.75
        metric: pur
        field: valid

    muon_reconstructed_tight:
      - hit: sihit
        thresh: 0.5
        metric: eff
        field: valid

      - hit: sihit
        thresh: 0.5
        metric: pur
        field: valid

    muon_reconstructed_loose:
      - hit: sihit
        thresh: 0.75
        metric: pur
        field: valid

    # Comet-like tracking efficiency: require only efficiency >= 0.5 on sihits.
    charged_reconstructed_comet:
      - hit: sihit
        thresh: 0.5
        metric: eff
        field: valid

  selections:
    charged_reconstructable_tight:
      - "is_primary"
      - "mom.r >= 0.1"
      - "mom.abs_eta <= 2.44"
      - "vtx.r <= 50"
      - "num_sihit >= 4"
      - "isolation >= 0.02"

    charged_reconstructable_loose:
      - "mom.r >= 0.01"
      - "num_sihit >= 4"

    charged_hadron_reconstructable_tight:
      - "is_charged_hadron"
      - "is_primary"
      - "mom.r >= 0.1"
      - "mom.abs_eta <= 2.44"
      - "vtx.r <= 50"
      - "num_sihit >= 4"
      - "isolation >= 0.02"

    charged_hadron_reconstructable_loose:
      - "is_charged_hadron"
      - "mom.r >= 0.01"
      - "num_sihit >= 4"

    electron_reconstructable_tight:
      - "is_electron"
      - "is_primary"
      - "mom.r >= 0.1"
      - "mom.abs_eta <= 2.44"
      - "vtx.r <= 50"
      - "num_sihit >= 4"
      - "isolation >= 0.02"

    electron_reconstructable_loose:
      - "is_electron"
      - "mom.r >= 0.01"
      - "num_sihit >= 4"

    muon_reconstructable_tight:
      - "is_muon"
      - "is_primary"
      - "mom.r >= 0.1"
      - "mom.abs_eta <= 2.44"
      - "vtx.r <= 50"
      - "num_sihit >= 4"
      - "isolation >= 0.02"

    muon_reconstructable_loose:
      - "is_muon"
      - "mom.r >= 0.01"
      - "num_sihit >= 4"

    # Approximate denominator used by Comet p0.5_sihit_eff.
    charged_reconstructable_comet:
      - "is_charged"
      - "num_sihit >= 1"

  residual_metrics: {}

  residual_histograms: {}

  residual_histogram_plots: {}

  bins:
    pt_100mev:
      min: 0.1
      max: 100.0
      num: 24
      scale: log

    pt_full:
      min: 0.01
      max: 100.0
      num: 32
      scale: log

    vtx_r_50mm:
      min: 0
      max: 50
      num: 32
      scale: linear

    num_sihit:
      min: 0.5
      max: 24.5
      num: 25
      scale: linear

    isolation_full:
      min: 0.01
      max: 3.14
      num: 32
      scale: log

    eta:
      min: -2.5
      max: 2.5
      num: 32
      scale: linear


  bulk_metrics:
    # Bulk efficiency metrics
    sitrack_charged_eff_tight:
      object_name: particle
      selection: charged_reconstructable_tight
      denominator: charged_reconstructable_tight
      numerator: sitrack_charged_reconstructed_tight

    flow_charged_eff_tight:
      object_name: particle
      selection: charged_reconstructable_tight
      denominator: charged_reconstructable_tight
      numerator: flow_charged_reconstructed_tight


    pandora_charged_eff_tight:
