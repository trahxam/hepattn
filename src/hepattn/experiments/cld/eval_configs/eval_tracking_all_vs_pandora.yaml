      metric: eff
      field: valid
    - hit: ecal
      thresh: 0.5
      metric: pur
      field: valid
    - hit: hcal
      thresh: 0.5
      metric: eff
      field: valid
    - hit: hcal
      thresh: 0.5
      metric: pur
      field: valid
    neutral_reconstructed:
