      metric: eff
      field: valid
    - hit: sihit
      thresh: 0.75
      metric: pur
      field: valid
    - hit: ecal
      thresh: 0.75
      metric: eff
      field: valid
    - hit: ecal
      thresh: 0.75
      metric: pur
      field: valid
    photon_reconstructed:
    - hit: ecal
      thresh: 0.75
      metric: eff
      field: valid
    - hit: ecal
      thresh: 0.75
      metric: pur
      field: valid
    muon_reconstructed:
    - hit: sihit
      thresh: 0.75
      metric: eff
      field: valid
    - hit: sihit
      thresh: 0.75
      metric: pur
      field: valid
    - hit: ecal
      thresh: 0.75
      metric: eff
      field: valid
    - hit: ecal
      thresh: 0.75
      metric: pur
      field: valid
    - hit: hcal
      thresh: 0.75
      metric: eff
      field: valid
    - hit: hcal
      thresh: 0.75
      metric: pur
      field: valid
    - hit: muon
      thresh: 0.75
      metric: eff
      field: valid
    - hit: muon
      thresh: 0.75
      metric: pur
      field: valid
  selections:
    charged_reconstructable_tight:
    - is_primary
    - mom.r >= 0.1
    - mom.abs_eta <= 2.44
    - vtx.r <= 50
    - num_sihit >= 4
    - isolation >= 0.02
    charged_reconstructable_loose:
    - is_charged_hadron
    - mom.r >= 0.01
    - mom.abs_eta <= 4
    - num_sihit >= 3
    - calib_energy_ecal >= 0.01
    - calib_energy_hcal >= 0.01
    charged_reconstructable_comet:
    - is_charged
    - num_sihit >= 1
    charged_reconstructable:
    - is_charged_hadron
    - is_primary
    - mom.r >= 0.1
    - mom.abs_eta <= 2.44
    - vtx.r <= 50
    - num_sihit >= 4
    - isolation >= 0.02
    - calib_energy_ecal >= 0.1
    - calib_energy_hcal >= 0.1
    neutral_reconstructable:
    - is_neutral_hadron
    - is_primary
    - mom.r >= 0.1
    - mom.abs_eta <= 2.44
    - vtx.r <= 50
    - isolation >= 0.02
    - calib_energy_ecal >= 0.1
    - calib_energy_hcal >= 0.1
    neutral_reconstructable_loose:
    - is_neutral_hadron
    - mom.r >= 0.01
    - mom.abs_eta <= 4
    - calib_energy_ecal >= 0.1
    - calib_energy_hcal >= 0.1
    electron_reconstructable:
    - is_electron
