name: ColliderML_Tracking_Example

data:
  class_path: hepattn.experiments.colliderml.data.data.ColliderMLDataModule
  init_args:
    # Paths to preprocessed data directories
    train_dir: /share/lustre/maxhart/data/colliderml/v1/pu200/
    val_dir: /share/lustre/maxhart/data/colliderml/v1/pu200/
    test_dir: /share/lustre/maxhart/data/colliderml/v1/pu200/

    # Event process name in this directory layout
    event_type: ttbar

    # Number of events to include in each set
    num_workers: 0
    num_train: -1
    num_test: 1000
    num_val: 100

    # Minimum pT for a particle to be deemed reconstructve in GeV
    particle_min_pt: 0.5
    particle_max_abs_eta: 4.0

    # Optional per-particle-type hit-content cuts.
    # When non-empty, these override the legacy global hit cuts.
    # Supported particle keys: all, charged_hadron, neutral_hadron,
    # electron, photon, muon, tau, neutrino, other
    # Supported cut keys: min_num_sihit, min_num_ecal, min_num_hcal
    particle_hit_cuts:
      charged_hadron:
        min_num_sihit: 3
        min_num_hcal: 0
      neutral_hadron:
        min_num_hcal: 0
      electron:
        min_num_sihit: 3
        min_num_ecal: 0
      photon:
        min_num_ecal: 0
      muon:
        min_num_sihit: 3
      tau:
        min_num_sihit: 3

    # Whether to include charged / neutral particles as targets
    particle_include_charged: true
    particle_include_neutral: true

    return_calohits: false
    return_tracks: false

# Training stuff here
trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 10
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: true
  val_check_interval: 1000

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: colliderml

  callbacks:
    # - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        every_n_train_steps: 2000
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10

model:
  class_path: hepattn.experiments.colliderml.models.model.ColliderMLModel
  init_args:
    optimizer:
      class_path: lion_pytorch.Lion
      init_args:
        lr: 1e-5
        weight_decay: 1e-5

    lr_scheduler:
      class_path: hepattn.utils.schedulers.OneCycleLR
      init_args:
        max_lr: 5e-5
        pct_start: 0.001
        div_factor: 5.0
        final_div_factor: 1.0

    model:
      class_path: hepattn.models.MaskFormer
      init_args:
        sorter:
          class_path: hepattn.components.Sorter
          init_args:
            input_sort_field: phi

        input_nets:
          class_path: torch.nn.ModuleList
          init_args:
            modules:
              - class_path: hepattn.components.InputNet
                init_args:
                  input_name: sihit
                  input_dtype: float32
                  fields:
                    - x
                    - y
                    - z
                    - r
                    - s
                    - eta
                    - phi
                    - layer_id
                  net:
                    class_path: hepattn.components.Dense
                    init_args:
                      input_size: 8
                      hidden_layers: [128]
                      output_size: 256
                      activation: SwiGLU
                  posenc:
                    class_path: hepattn.components.PositionEncoder
                    init_args:
                      input_name: sihit
                      dim: 256
                      fields:
                        - r
                        - eta
                        - phi

        encoder:
          class_path: hepattn.components.Encoder
          init_args:
            num_layers: 4
            dim: 256
            attn_type: flash
            window_size: 512
            window_wrap: true
            hybrid_norm: true
            norm: FastLayerNorm
            dense_kwargs: {activation: SwiGLU}
            attn_kwargs: {bias: false}

        decoder:
          num_decoder_layers: 4
          num_queries: 1024
          mask_attention: true
          decoder_layer_config:
            dim: 256
            norm: FastLayerNorm
            hybrid_norm: true
            dense_kwargs: {activation: SwiGLU}
            attn_kwargs: {bias: false}

          tasks:
            class_path: torch.nn.ModuleList
            init_args:
              modules:
                - class_path: hepattn.models.tasks.ObjectClassificationTask
                  init_args:
                    name: flow_valid
                    input_object: query
                    output_object: flow
                    target_object: particle
                    losses:
                      object_bce: 0.1
                    costs:
                      object_bce: 0.1
                    dim: 256
                    null_weight: 1.0
                    mask_queries: false
                    has_intermediate_loss: true
                    has_first_layer_loss: false

                - class_path: hepattn.models.tasks.ObjectHitMaskTask
                  init_args:
                    name: flow_sihit_assignment
                    input_constituent: sihit
                    input_object: query
                    output_object: flow
                    target_object: particle
                    predict_iou: true
                    losses:
                      mask_dice: 2.0
                      mask_focal: 100.0
                    costs:
                      mask_dice: 2.0
                      mask_focal: 100.0
                    null_weight: 1.0
                    dim: 256

        matcher:
          class_path: hepattn.models.Matcher
          init_args:
            default_solver: scipy
            adaptive_solver: false
            parallel_solver: true
