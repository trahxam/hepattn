seed_everything: 42
name: atlas-muon-filtering-test

data:
  class_path: hepattn.experiments.atlas_muon.data.data.AtlasMuonDataModule
  init_args:
    dummy_data: true

    train_dir: dummy
    val_dir: dummy
    test_dir: dummy

    num_workers: 1
    num_train: -1
    num_test: -1
    num_val: -1

    # ATLAS muon data parameters
    event_max_num_particles: 10

    # Define which inputs will be available to the model
    inputs:
      hit:
        # Global hit coordinates
        - spacePoint_globEdgeHighX
        - spacePoint_globEdgeHighY
        - spacePoint_globEdgeHighZ
        - spacePoint_globEdgeLowX
        - spacePoint_globEdgeLowY
        - spacePoint_globEdgeLowZ
        - spacePoint_driftR
        # Detector information
        - spacePoint_channel
        - spacePoint_layer
        - spacePoint_stationPhi
        - spacePoint_stationEta
        - spacePoint_stationIndex
        - spacePoint_technology
        # Derived hit fields
        - r
        - s
        - theta
        - phi
        - eta

    targets:
      hit:
        - on_valid_particle

trainer:
  fast_dev_run: 2
  max_epochs: 20
  accelerator: cpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: true
  logger: false

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: false
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  class_path: hepattn.experiments.atlas_muon.models.filter.AtlasMuonFilter
  init_args:
    optimizer:
      class_path: lion_pytorch.Lion
      init_args:
        lr: 1e-5
        weight_decay: 1e-5

    lr_scheduler:
      class_path: hepattn.utils.schedulers.OneCycleLR
      init_args:
        max_lr: 5e-5
        pct_start: 0.05
        div_factor: 5.0
        final_div_factor: 10.0

    model:
      class_path: hepattn.models.HitFilter
      init_args:
        sorter: null
        input_nets:
          class_path: torch.nn.ModuleList
          init_args:
            modules:
              - class_path: hepattn.components.InputNet
                init_args:
                  input_name: hit
                  fields:
                    - spacePoint_globEdgeHighX
                    - spacePoint_globEdgeHighY
                    - spacePoint_globEdgeHighZ
                    - spacePoint_globEdgeLowX
                    - spacePoint_globEdgeLowY
                    - spacePoint_globEdgeLowZ
                    - spacePoint_driftR
                    - spacePoint_channel
                    - spacePoint_layer
                    - spacePoint_stationPhi
                    - spacePoint_stationEta
                    - spacePoint_stationIndex
                    - spacePoint_technology
                    - r
                    - s
                    - theta
                    - phi
                    - eta
                  net:
                    class_path: hepattn.components.Dense
                    init_args:
                      input_size: 18
                      output_size: &dim 64
                  posenc:
                    class_path: hepattn.components.PositionEncoder
                    init_args:
                      input_name: hit
                      fields:
                        - r
                        - theta
                        - phi
                      dim: *dim

        encoder:
          class_path: hepattn.components.Encoder
          init_args:
            num_layers: 2
            dim: *dim
            attn_type: torch
            hybrid_norm: true
            norm: RMSNorm

        tasks:
          class_path: torch.nn.ModuleList
          init_args:
            modules:
              - class_path: hepattn.tasks.HitFilterTaskBatched
                init_args:
                  name: hit_filter
                  input_object: hit
                  target_field: on_valid_particle
                  dim: *dim
                  threshold: 0.01
                  loss_fn: bce
