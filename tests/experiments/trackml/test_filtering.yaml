seed_everything: 42
name: filtering-test

data:
  class_path: reconstruct_anything.experiments.trackml.data.data.TrackMLDataModule
  init_args:
    dummy_data: true

    train_dir: dummy
    val_dir: dummy
    test_dir: dummy

    num_workers: 1
    num_train: -1
    num_test: -1
    num_val: -1

    # Select only hits from these detector volumes
    # pix barrel: 8, pix endcap: 7, 9
    # See: https://competitions.codalab.org/competitions/20112
    hit_volume_ids: [8]

    # Minimum pt for a particle to be deemed reconstructible
    particle_min_pt: 1.0

    # Maximum absolute eta for a particle to be deemed reconstructible
    particle_max_abs_eta: 2.5

    # Minimum number of true hits for a particle to be deemed reconstructible
    particle_min_num_hits: 3

    # Maximum number of reconstructable particles allowed in an event (not relevant for filtering)
    event_max_num_particles: 3000

    # Define which inputs will be available to the model
    inputs:
      hit:
        # Global hit coords
        - x
        - y
        - z
        - r
        - s
        - eta
        - phi
        - u
        - v
        # Hit local charge information
        - charge_frac
        - leta
        - lphi
        - lx
        - ly
        - lz
        - geta
        - gphi

    targets:
      hit:
        - on_valid_particle

trainer:
  fast_dev_run: 2
  max_epochs: 20
  accelerator: cpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: True
  logger: false

  callbacks:
    - class_path: reconstruct_anything.callbacks.InferenceTimer
    - class_path: reconstruct_anything.callbacks.SaveConfig
    - class_path: reconstruct_anything.callbacks.Checkpoint
      init_args:
        monitor: val/loss
    - class_path: reconstruct_anything.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: false
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  class_path: reconstruct_anything.experiments.trackml.models.filter.TrackMLFilter
  init_args:
    optimizer:
      class_path: lion_pytorch.Lion
      init_args:
        lr: 1e-5
        weight_decay: 1e-5

    lr_scheduler:
      class_path: reconstruct_anything.utils.schedulers.OneCycleLR
      init_args:
        max_lr: 5e-5
        pct_start: 0.05
        div_factor: 5.0
        final_div_factor: 10.0

    model:
      class_path: reconstruct_anything.models.HitFilter
      init_args:
        sorter: null
        input_nets:
          class_path: torch.nn.ModuleList
          init_args:
            modules:
              - class_path: reconstruct_anything.components.InputNet
                init_args:
                  input_name: hit
                  fields:
                    - x
                    - y
                    - z
                    - r
                    - eta
                    - phi
                    - u
                    - v
                    - charge_frac
                    - leta
                    - lphi
                    - lx
                    - ly
                    - lz
                    - geta
                    - gphi
                  net:
                    class_path: reconstruct_anything.components.Dense
                    init_args:
                      input_size: 16
                      output_size: &dim 64
                  posenc:
                    class_path: reconstruct_anything.components.FourierPositionEncoder
                    init_args:
                      input_name: hit
                      fields:
                        - r
                        - eta
                        - phi
                      dim: *dim
                      scale: 0.1
        encoder:
          class_path: reconstruct_anything.components.Encoder
          init_args:
            num_layers: 2
            dim: *dim
            attn_type: torch
            hybrid_norm: true
            norm: RMSNorm

        tasks:
          class_path: torch.nn.ModuleList
          init_args:
            modules:
              - class_path: reconstruct_anything.models.tasks.HitFilterTask
                init_args:
                  name: hit_filter
                  input_object: hit
                  target_field: on_valid_particle
                  dim: *dim
                  threshold: 0.1
                  loss_fn: bce
